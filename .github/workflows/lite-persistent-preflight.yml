name: Lite persistent Add preflight
on:
  push:
    branches: [verify/lite-persistent-add-20261112]

permissions:
  contents: read

env:
  CANDIDATE_SHA: c078950852033dc6e0604efe5d0fd449f9b156ed
  VSAG_TEST_SEED: '424242'

jobs:
  linux-lite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Run standalone release, coverage and sanitizer checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          build_and_test() {
            folder=$1
            shift
            cmake -S lite -B "$folder" -G Ninja -DCMAKE_CXX_COMPILER=g++-13 \
              -DENABLE_TESTS=ON "$@"
            cmake --build "$folder" --parallel 3
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir "$folder" --output-on-failure
          }
          build_and_test build-lite-on -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_RABITQ_LITE_BACKEND=ON -DENABLE_LITE_PERSISTENT_ADD=ON
          build_and_test build-lite-off -DCMAKE_BUILD_TYPE=Release
          build_and_test build-lite-coverage -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_RABITQ_LITE_BACKEND=ON -DENABLE_LITE_PERSISTENT_ADD=ON -DENABLE_COVERAGE=ON
          python3 lite/tools/collect_coverage.py --root "$PWD" --build "$PWD/build-lite-coverage" \
            --output "$RUNNER_TEMP/lite-coverage.json" --fail-under 90
          build_and_test build-lite-asan -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_RABITQ_LITE_BACKEND=ON -DENABLE_LITE_PERSISTENT_ADD=ON \
            '-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined -no-pie' \
            '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: persistence-lite-coverage
          path: ${{ runner.temp }}/lite-coverage.json

  linux-circle-equivalent:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Run the maintained Linux build and tests
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sudo bash scripts/deps/install_toolchain_ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y gfortran python3-dev libomp-20-dev gcc make cmake g++ lcov libaio-dev libcurl4-openssl-dev ninja-build libopenblas-dev liblapacke-dev
          export CMAKE_GENERATOR=Ninja VSAG_ENABLE_INTEL_MKL=OFF EXTRA_DEFINED="-DUSE_SYSTEM_OPENBLAS=ON" COMPILE_JOBS=4
          make test_parallel

  linux-tsan:
    runs-on: ubuntu-24.04
    container: vsaglib/vsag:ci-main-openblas
    timeout-minutes: 120
    env:
      EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=ON
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Run maintained TSan concurrent tests
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          CMAKE_GENERATOR=Ninja make tsan COMPILE_JOBS=3
          printf '%s\n' race:libomp.so race:libomp.so.5 race:fmt::v10::detail::format_decimal race:libmkl_intel_thread.so.2 > omp.supp
          TSAN_OPTIONS=suppressions=omp.supp ./build/tests/functests '[concurrent]~[daily]'

  linux-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Prepare maintained wheel dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sudo bash scripts/deps/install_deps_ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y python3-venv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build and test a fresh wheel
        run: |
          export CMAKE_GENERATOR=Ninja VSAG_OPENBLAS_TARGET=GENERIC CIBW_ENVIRONMENT="VSAG_OPENBLAS_TARGET=GENERIC"
          make pyvsag PY_VERSION=3.10
          python -m venv "$RUNNER_TEMP/lite-persistence-wheel"
          . "$RUNNER_TEMP/lite-persistence-wheel/bin/activate"
          python -m pip install wheelhouse/*.whl numpy pyjson pytest
          python -m pytest tests/python -v --tb=short

  macos-full-asan:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Prepare maintained dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bash scripts/deps/install_deps.sh
      - name: Run maintained Full ASan build
        run: CMAKE_GENERATOR=Ninja CMAKE_EXPORT_COMPILE_COMMANDS=ON make asan VSAG_ENABLE_EXAMPLES=ON COMPILE_JOBS=3

  macos-lite-with-baseline-fixes:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Apply the known baseline compatibility changes for this diagnostic
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags --depth=8 https://github.com/antgroup/vsag.git 51045beff6b0445e25cd96f4f62f87432e932c2c
          git show bec879a --format= -- lite/CMakeLists.txt | git apply -
          python3 - <<'PY'
          from pathlib import Path
          for name in ('graph_backend.cpp', 'rabitq_graph_state.h'):
              path = Path('src/lite') / name
              original = path.read_text()
              old = 'std::min(needed, ranked.size())'
              assert original.count(old) == 1
              path.write_text(original.replace(old, 'std::min<uint64_t>(needed, ranked.size())'))
          PY
          git diff --check
          git diff --stat
      - name: Build and test the persistence path with ASan
        run: |
          cmake -S lite -B build-lite -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON -DENABLE_RABITQ_LITE_BACKEND=ON -DENABLE_LITE_PERSISTENT_ADD=ON \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-lite --parallel 3
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-lite --output-on-failure
